[project]
name = "meu-livro"
version = "0.1.0"
description = "Ecos de Baía Cinzenta – geração de arte e tooling"
requires-python = ">=3.10"

dependencies = [
    "requests",
    "google-genai>=2.0.0",
    "pillow>=10.3.0",
    "ollama>=0.4.7",
    "gtts>=2.5.0",
    "pydub>=0.25.1",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
art = [
    "diffusers",
    "transformers",
    "accelerate",
    "torch",
]

[project.scripts]
local-art-gen = "scripts.local_art_gen:main"
video-gen = "scripts.video_gen.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
