[project]
name = "meu-livro"
version = "0.1.0"
description = "Ecos de Baía Cinzenta – geração de arte e tooling"
requires-python = ">=3.10"

dependencies = [
    "requests",
    "google-genai>=2.0.0",
    "pillow>=10.3.0,<13",
    "ollama>=0.4.7",
    "gtts>=2.5.0",
    "pydub>=0.25.1",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
art = [
    "diffusers",
    "transformers",
    "accelerate",
    "torch",
]

[project.scripts]
local-art-gen = "scripts.local_art_gen:main"
video-gen = "scripts.video_gen.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
# Os testes de scripts/ dependem de torch (extra `art`) e não entram no gate padrão.
testpaths = ["tests"]

[tool.uv]
# Transitivas com CVE: o piso fica na correção, o teto evita salto de major
constraint-dependencies = [
    "cryptography>=46.0.7,<47",
    "urllib3>=2.8.0,<3",
    "requests>=2.33.0,<3",
    "anyio>=4.14.2,<5",
    "certifi>=2026.10.19",
    "idna>=3.15,<4",
]
