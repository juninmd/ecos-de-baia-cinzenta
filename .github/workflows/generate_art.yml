name: Automated Chapter Art Generation

on:
  pull_request:
    paths:
      - 'docs/public/capitulo-*.md'
      - 'docs/capitulo-*.md'
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter file to process'
        required: true
        default: 'docs/public/capitulo-10.md'

permissions:
  contents: write

jobs:
  generate-art:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-art.txt

      - name: Cache Ollama Models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-tinyllama-v1

      - name: Install Dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements-art.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Start Ollama in background
          ollama serve > ollama.log 2>&1 &
          # Wait for Ollama to be ready with proper timeout
          echo "Waiting for Ollama to start..."
          timeout 60s bash -c 'until curl -s http://localhost:11434 > /dev/null; do sleep 2; done' || {
            echo "Ollama failed to start within 60 seconds"
            cat ollama.log
            exit 1
          }
          echo "Ollama is ready!"
        timeout-minutes: 3

      - name: Pull Ollama Model
        run: |
          echo "Pulling tinyllama model (this may take several minutes)..."
          ollama pull tinyllama
        timeout-minutes: 15

      - name: Generate Art
        env:
          SD_API_URL: ${{ secrets.SD_API_URL }}
          OLLAMA_HOST: http://localhost:11434
        run: |
          if [ -z "${SD_API_URL}" ]; then
            echo "SD_API_URL is not configured. Skipping image generation to avoid slow CPU fallback timeout."
            exit 0
          fi

          CHAPTER="${{ github.event.inputs.chapter || '' }}"
          if [ -z "$CHAPTER" ]; then
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              CHAPTER=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep 'capitulo-.*\.md' | head -n 1 || true)
            else
              # Attempt to find changed chapter file for push events
              BEFORE_SHA="${{ github.event.before }}"
              CURRENT_SHA="${{ github.sha }}"

              # Only diff when both SHAs resolve to real commits.
              if [ -n "$BEFORE_SHA" ] \
                && [ -n "$CURRENT_SHA" ] \
                && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null \
                && git cat-file -e "$CURRENT_SHA^{commit}" 2>/dev/null; then
                CHAPTER=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep 'capitulo-.*\.md' | head -n 1 || true)
              fi
            fi

            # Fallback for initial commits or when no previous SHA is available
            if [ -z "$CHAPTER" ]; then
              CHAPTER=$(git show --name-only --pretty="" "$CURRENT_SHA" 2>/dev/null | grep 'capitulo-.*\.md' | head -n 1 || true)
            fi

            # Last fallback: current tree state (works for manual reproductions).
            if [ -z "$CHAPTER" ]; then
              CHAPTER=$(git ls-files | grep -E '^(docs|docs/public)/capitulo-.*\.md$' | head -n 1 || true)
            fi
          fi

          if [ -z "$CHAPTER" ]; then
            echo "No chapter specified or found in changes."
            exit 0
          fi

          echo "Processing chapter: $CHAPTER"
          python3 scripts/generate_chapter_art.py --chapter "$CHAPTER" --ollama-model tinyllama
        timeout-minutes: 60

      - name: Commit and Push Changes
        run: |
          git config --global user.name "ArtBot"
          git config --global user.email "artbot@example.com"
          git add docs/public/*.jpg || true
          git add docs/public/*.md || true
          git add docs/*.md || true
          # Check for changes before committing
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: generated art for chapter"
          git push
