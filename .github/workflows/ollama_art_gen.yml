name: Local Art Generation (Ollama)

on:
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter Number'
        required: true
        default: '104'
      style:
        description: 'Art Style'
        required: false
        default: 'cyberpunk, noir'

jobs:
  generate-with-ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Start Ollama Service
        run: docker compose up -d ollama

      - name: Wait for Ollama
        run: |
          echo "Waiting for Ollama to be ready..."
          timeout 60s bash -c 'until curl -s http://localhost:11434 > /dev/null; do sleep 2; done'
          echo "Ollama is ready!"

      - name: Pull Llama2 Model
        run: docker compose exec ollama ollama pull llama2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests pillow

      - name: Run Fallback Script (Ollama + HF)
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          python scripts/nano_banana_fallback.py ${{ github.event.inputs.chapter }} \
            --style "${{ github.event.inputs.style }}" \
            --ollama \
            --ollama-model llama2

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: generated-art-ollama
          path: docs/public/capitulo_*.jpg
