name: Video Generation

on:
  push:
    branches: [main]
    paths:
      - 'docs/capitulo-*.md'
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter number (leave empty for all changed)'
        required: false
        default: ''

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2  # Need previous commit for diff
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Cache Python Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements-dev.txt
          # Install ffmpeg for video encoding
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Setup Assets
        run: |
          python scripts/setup_assets.py
      
      - name: Detect Changed Chapters
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.chapter }}" ]; then
            # Manual trigger with specific chapter
            echo "chapters=${{ github.event.inputs.chapter }}" >> $GITHUB_OUTPUT
          else
            # Auto-detect from git diff
            changed=$(git diff --name-only HEAD~1 HEAD | grep 'docs/capitulo-.*\.md' | sed 's/docs\/capitulo-\([0-9]*\)\.md/\1/' | tr '\n' ' ')
            if [ -z "$changed" ]; then
              echo "No chapters changed"
              echo "chapters=" >> $GITHUB_OUTPUT
            else
              echo "Changed chapters: $changed"
              echo "chapters=$changed" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Generate Videos
        if: steps.detect.outputs.chapters != ''
        run: |
          chapters="${{ steps.detect.outputs.chapters }}"
          for chapter in $chapters; do
            echo "Generating video for chapter $chapter..."
            python scripts/video_generator.py --chapter $chapter || echo "Failed chapter $chapter"
          done
      
      - name: Commit Generated Videos
        if: steps.detect.outputs.chapters != ''
        run: |
          git config --local user.name "Video Bot"
          git config --local user.email "bot@ecosdebaiacinzenta.com"
          
          git add docs/public/videos/*.mp4
          
          if git diff --staged --quiet; then
            echo "No videos generated"
          else
            git commit -m "chore: generate videos for chapters ${{ steps.detect.outputs.chapters }}"
            git push
          fi
      
      - name: Upload Video Artifacts
        if: steps.detect.outputs.chapters != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: docs/public/videos/*.mp4
          retention-days: 7
