name: Art Gen L1 - Micro (Lightest)

on:
  pull_request:
    paths:
      - 'docs/capitulo-*.md'
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter Number'
        required: true
        default: '138'
      style:
        description: 'Art Style'
        required: false
        default: 'cyberpunk, noir'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Chapter
        id: info
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Extract chapter from modified files in PR
            CHAPTER=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep 'docs/capitulo-.*\.md' | sed -E 's/.*capitulo-([0-9.]+)\.md/\1/' | head -n 1)
          else
            CHAPTER=${{ inputs.chapter }}
          fi
          echo "chapter=$CHAPTER" >> $GITHUB_OUTPUT
          echo "Detected Chapter: $CHAPTER"

      - name: Start Ollama
        run: docker run -d -v ollama:/root/.ollama -p 11434:11434 --name ollama ollama/ollama

      - name: Wait and Pull Model
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:11434 > /dev/null; do sleep 2; done'
          docker exec ollama ollama pull llama2:7b-fp16 # Lighter version for speed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install requests pillow diffusers transformers accelerate torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Generate Art
        if: steps.info.outputs.chapter != ''
        run: |
          python scripts/local_art_gen.py ${{ steps.info.outputs.chapter }} \
            --style "${{ inputs.style || 'cyberpunk, noir' }}" \
            --model-family sd15 \
            --steps 8 \
            --output-suffix "_micro" \
            --ollama-model llama2:7b-fp16

      - name: Commit and Push
        if: steps.info.outputs.chapter != ''
        run: |
          git config --global user.name "Art Bot L1"
          git config --global user.email "bot@meu-livro.local"
          git add docs/public/capitulo_${{ steps.info.outputs.chapter }}_micro.jpg
          git commit -m "chore: generate micro art for chapter ${{ steps.info.outputs.chapter }}" || echo "No changes"
          git push
