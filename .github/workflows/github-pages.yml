name: GitHub Pages

# Publica o site do VitePress em https://<owner>.github.io/<repo>/.
# Convive com o Netlify, que serve o mesmo conteúdo na raiz do próprio domínio:
# a diferença entre os dois é só o prefixo de caminho, que vai em VITEPRESS_BASE.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Um deploy por vez, sem cancelar o que já está publicando.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # O nome do repositório vem do próprio evento: renomear o repo muda a
        # URL do Pages e o base acompanha, sem ninguém precisar editar nada.
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
        run: pnpm docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
