name: Validate

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # O reusable não declara `on.workflow_call.secrets`, então passar
    # `secrets:` aqui derrubava o run inteiro em startup_failure. O checkout
    # recebe o GITHUB_TOKEN implícito via permissions do próprio reusable.
    uses: juninmd/base-actions/.github/workflows/reusable-validate.yml@main
