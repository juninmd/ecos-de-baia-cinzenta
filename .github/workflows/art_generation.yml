name: Official Art Generation (Local/Ollama)

on:
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter Number'
        required: true
        default: '104'
      style:
        description: 'Art Style'
        required: false
        default: 'cyberpunk, noir'

jobs:
  generate-local-art:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Start Ollama Service
        run: docker compose up -d ollama

      - name: Wait for Ollama
        run: |
          echo "Waiting for Ollama to be ready..."
          timeout 60s bash -c 'until curl -s http://localhost:11434 > /dev/null; do sleep 2; done'
          echo "Ollama is ready!"

      - name: Pull Llama2 Model
        run: docker compose exec ollama ollama pull llama2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        # Using lighter torch CPU version to save bandwidth if possible, but diffusers usually grabs full torch.
        # Accelerate and Transformers needed for Diffusers.
        run: |
          pip install --upgrade pip
          pip install requests pillow diffusers transformers accelerate torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Local Art Generation
        # No API Keys needed!
        run: |
          python scripts/local_art_gen.py ${{ inputs.chapter }} \
            --style "${{ inputs.style }}" \
            --ollama-model llama2

      - name: Config Git
        run: |
          git config --global user.name "Ollama Art Bot"
          git config --global user.email "bot@ollama.local"

      - name: Commit and Push
        run: |
          git add docs/public/capitulo_${{ inputs.chapter }}.jpg
          git add docs/capitulo-${{ inputs.chapter }}.md
          # Handle case where nothing changed (if generation failed but didn't crash)
          git commit -m "chore: generate art for chapter ${{ inputs.chapter }} (Ollama/Local)" || echo "No changes to commit"
          git push

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: generated-art-local
          path: docs/public/capitulo_*.jpg
