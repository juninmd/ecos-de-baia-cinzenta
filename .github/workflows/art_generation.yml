name: Art Gen L4 - Pro

on:
  pull_request:
    paths:
      - 'docs/capitulo-*.md'
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter Number'
        required: true
        default: '138'
      style:
        description: 'Art Style'
        required: false
        default: 'cyberpunk, noir'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine Chapter
        id: info
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Extract chapter from modified files in PR
            CHAPTER=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep 'docs/capitulo-.*\.md' | sed -E 's/.*capitulo-([0-9.]+)\.md/\1/' | head -n 1)
          else
            CHAPTER=${{ inputs.chapter }}
          fi
          echo "chapter=$CHAPTER" >> $GITHUB_OUTPUT

      - name: Start Ollama
        run: docker compose up -d ollama

      - name: Wait for Ollama
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:11434 > /dev/null; do sleep 2; done'
          docker compose exec -T ollama ollama pull llama2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install requests pillow diffusers transformers accelerate torch bitsandbytes scipy protobuf sentencepiece --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Generate Art
        if: steps.info.outputs.chapter != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/local_art_gen.py ${{ steps.info.outputs.chapter }} \
            --style "${{ inputs.style || 'cyberpunk, noir' }}" \
            --model-family flux2-dev \
            --steps 28

      - name: Upload Artifact
        if: steps.info.outputs.chapter != ''
        uses: actions/upload-artifact@v7
        with:
          name: capitulo-${{ steps.info.outputs.chapter }}-art
          path: docs/public/capitulo_${{ steps.info.outputs.chapter }}_pro.jpg
          retention-days: 7

      - name: Commit and Push
        if: steps.info.outputs.chapter != ''
        run: |
          git config --global user.name "Art Bot L4"
          git config --global user.email "bot@meu-livro.local"
          git add docs/public/capitulo_${{ steps.info.outputs.chapter }}_pro.jpg
          git commit -m "chore: generate pro art for chapter ${{ steps.info.outputs.chapter }}" || echo "No changes"
          git push
