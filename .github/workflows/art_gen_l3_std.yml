name: Art Gen L3 - Standard

on:
  push:
    paths:
      - 'docs/capitulo-*.md'
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter Number'
        required: true
        default: '138'
      style:
        description: 'Art Style'
        required: false
        default: 'cyberpunk, noir'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine Chapter
        id: info
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            CHAPTER=$(git diff --name-only HEAD^ HEAD | grep 'docs/capitulo-.*\.md' | sed -E 's/.*capitulo-([0-9.]+)\.md/\1/' | head -n 1)
          else
            CHAPTER=${{ inputs.chapter }}
          fi
          echo "chapter=$CHAPTER" >> $GITHUB_OUTPUT

      - name: Start Ollama
        run: docker compose up -d ollama

      - name: Wait for Ollama
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:11434 > /dev/null; do sleep 2; done'
          docker compose exec -T ollama ollama pull llama2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install requests pillow diffusers transformers accelerate torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate Art
        if: steps.info.outputs.chapter != ''
        run: |
          python scripts/local_art_gen.py ${{ steps.info.outputs.chapter }} 
            --style "${{ inputs.style || 'cyberpunk, noir' }}" 
            --model-family sdxl 
            --steps 15 
            --output-suffix "_std"

      - name: Commit and Push
        if: steps.info.outputs.chapter != ''
        run: |
          git config --global user.name "Art Bot L3"
          git config --global user.email "bot@meu-livro.local"
          git add docs/public/capitulo_${{ steps.info.outputs.chapter }}_std.jpg
          git commit -m "chore: generate standard art for chapter ${{ steps.info.outputs.chapter }}" || echo "No changes"
          git push
