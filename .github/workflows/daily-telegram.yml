name: Daily Telegram Chapter

on:
  schedule:
    # 11:00 UTC = 08:00 BRT
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      chapter:
        description: "Capítulo específico (vazio = próximo da fila)"
        required: false
        type: string
      skip_video:
        description: "Enviar só imagem + texto (sem vídeo)"
        required: false
        default: false
        type: boolean
      simple_video:
        description: "Vídeo simples (1 imagem) em vez do animado multi-cena"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Testar sem enviar nada ao Telegram"
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-telegram
  cancel-in-progress: false

jobs:
  send:
    name: Send chapter to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests gtts pillow gradio_client

      - name: Build CLI args
        id: args
        run: |
          ARGS=""
          if [ -n "${{ inputs.chapter }}" ]; then ARGS="$ARGS --chapter ${{ inputs.chapter }}"; fi
          if [ "${{ inputs.skip_video }}" = "true" ]; then ARGS="$ARGS --no-video"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.simple_video }}" != "true" ]; then ARGS="$ARGS --animated --scenes 4"; fi
          echo "value=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Send chapter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m scripts.daily_telegram.main ${{ steps.args.outputs.value }}

      # Não existe passo de persistência: o capítulo do dia é derivado da data
      # em scripts/daily_telegram/state.py. A versão anterior commitava o
      # progresso e dava `git push` no master, que é protegido — o push falhava
      # com GH006 em todo run desde 27/07 e a fila reenviava o mesmo capítulo.
