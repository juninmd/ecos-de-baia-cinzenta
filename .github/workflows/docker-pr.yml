name: Docker PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build PR image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: book-pr:check
      - name: Check the container serves the book
        shell: bash
        run: |
          docker run --detach --rm --name book-pr --publish 127.0.0.1:8080:8080 book-pr:check
          curl --fail --silent --show-error --max-time 5 --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/ --output "$RUNNER_TEMP/book-home.html"
          grep -q 'Ecos de Baía Cinzenta' "$RUNNER_TEMP/book-home.html"
      - name: Stop test container
        if: always()
        run: docker rm --force book-pr || true
